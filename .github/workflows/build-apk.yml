name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_RAW_VERSION"

          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is not a regular file or is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK successfully verified at $EXPECTED_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi

          SANITIZED_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi

          TARGET_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${ASSET_DIR}/${TARGET_FILENAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"

          if [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_PATH."
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$TARGET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking gh CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### Debug APK Build Details
          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Usage:** Intended for testing and evaluation purposes.
          - **Notice:** This APK is not a Play Store production release. It is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "Release Publishing Succeeded!"
            echo "=================================================="

            RELEASE_VIEW=$(gh release view "$TAG_NAME" --json tagName,name,url 2>/dev/null || true)
            RELEASE_URL=$(echo "$RELEASE_VIEW" | grep -o '"url":"[^"]*' | cut -d'"' -f4 || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo ""

            echo "### 🚀 Debug APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Debug APK built and published successfully!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download:** You can download **\`$ASSET_NAME\`** directly from the **Assets** section of the [GitHub Release]($RELEASE_URL)." >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact Backup:** The \`app-debug-apk\` artifact is also available as a backup under the workflow summary page." >> $GITHUB_STEP_SUMMARY
          else
            echo "=================================================="
            echo "WARNING: Release Publishing Encountered an Issue"
            echo "=================================================="
            echo "The debug APK was built successfully."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."
            echo ""

            echo "### ⚠️ Debug APK Build Summary (Artifact Available)" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Debug APK build succeeded, but GitHub Release creation encountered an issue." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Download:** The debug APK artifact **\`app-debug-apk\`** was successfully uploaded and is available to download from this workflow run." >> $GITHUB_STEP_SUMMARY
            echo "- Note: Completed APK build is preserved." >> $GITHUB_STEP_SUMMARY
          fi
